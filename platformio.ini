; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
description = LVGL-320-480
default_envs = LVGL-320-480
boards_dir = boards
src_dir = src

[libraries]

[com]
platform = espressif32@6.6.0
board = esp32s3dev
monitor_filters = esp32_exception_decoder
framework = espidf
build_type = debug
board_build.filesystem = littlefs
build_flags = 
	-D LOG_LOCAL_LEVEL=ESP_LOG_INFO
	-O2
build_unflags = -Og
lib_deps = 


[env:LVGL-320-480]
platform = ${com.platform}
board = 320x480
monitor_filters = ${com.monitor_filters}
framework = ${com.framework}
build_type = ${com.build_type}
board_build.filesystem = ${com.board_build.filesystem}
; 3 MB app slot; the 1.5 MB slot of partitions_singleapp_large.csv is full. NVS stays at 0x9000, so settings survive the change.
board_build.partitions = partitions_macropad.csv
extra_scripts =
	post:tools/clear_force_download.py
	post:tools/strip_link_groups.py
lib_deps =
	lvgl/lvgl@8.4.0
build_unflags = ${com.build_unflags}
build_flags =
	${com.build_flags}
	-D LV_CONF_PATH=${PROJECT_DIR}/src/lv_conf.h

; Debug build: console and panic output on the USB-Serial-JTAG port (/dev/ttyACM0, 303a:1001); no HID.
; Flashing works without any gesture. Not for normal use: the keys do nothing in this build.
[env:LVGL-320-480-dbg]
extends = env:LVGL-320-480
build_flags =
	${env:LVGL-320-480.build_flags}
	-D MACROPAD_NO_HID=1
